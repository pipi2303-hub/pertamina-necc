<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pertamina — National Energy Command Center</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <img src="img/logo.png" class="brand-logo" alt="Pertamina Logo"/>
      <div class="brand-text">
        <span class="brand-name">PERTAMINA</span>
        <span class="brand-subtitle">National Energy Command Center</span>
      </div>
    </div>

    <div class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-dash="command">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0L15 14H1L8 0Z"/><circle cx="8" cy="10" r="2" fill="rgba(255,255,255,0.4)"/></svg>
        Command Center
      </button>
      <button class="nav-tab" data-dash="upstream">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 5v6M5 8h6"/></svg>
        Upstream
      </button>
      <button class="nav-tab" data-dash="refinery">
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="8" width="3" height="6"/><rect x="6" y="5" width="3" height="9"/><rect x="10" y="2" width="3" height="12"/><path d="M2 8 L5 5 Q8 2 11 2"/></svg>
        Refinery
      </button>
      <button class="nav-tab" data-dash="storage">
        <svg viewBox="0 0 16 16" fill="currentColor"><ellipse cx="8" cy="4" rx="6" ry="2"/><path d="M2 4v8a6 2 0 0 0 12 0V4"/></svg>
        Storage
      </button>
      <button class="nav-tab" data-dash="logistics">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 10L4 4h8l3 6v2H1v-2zM5 13a1 1 0 100-2 1 1 0 000 2zM11 13a1 1 0 100-2 1 1 0 000 2z"/></svg>
        Logistics
      </button>
      <button class="nav-tab" data-dash="distribution">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="10" r="2"/><circle cx="12" cy="10" r="2"/><path d="M1 10V6l3-3h6l3 3v4"/><rect x="4" y="4" width="5" height="6"/></svg>
        Distribution
      </button>
      <button class="nav-tab" data-dash="spklu">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M9 1L5 9h4l-2 6 6-8h-4l2-6z"/></svg>
        SPKLU EV
      </button>
      <button class="nav-tab" data-dash="ai">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a5 5 0 100 10A5 5 0 008 1zm0 2a1 1 0 110 2 1 1 0 010-2zm-1 3h2v4H7V6z"/><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        AI Analytics
      </button>
    </div>

    <div class="navbar-right">
      <div class="live-badge"><span class="pulse-dot"></span>LIVE</div>
      <div class="clock-wrap">
        <div id="clock-time" class="clock-time">--:--:--</div>
        <div id="clock-date" class="clock-date">-- --- ----</div>
      </div>
    </div>
  </nav>

  <main id="main" class="main">
    <div id="dash-command"  class="dash active"></div>
    <div id="dash-upstream"     class="dash"></div>
    <div id="dash-refinery"     class="dash"></div>
    <div id="dash-storage"      class="dash"></div>
    <div id="dash-logistics"    class="dash"></div>
    <div id="dash-distribution" class="dash"></div>
    <div id="dash-spklu"        class="dash"></div>
    <div id="dash-ai"           class="dash"></div>
  </main>

  <script src="js/app.js?v=3"></script>
  <script src="js/cmd-center.js?v=3"></script>
  <script src="js/upstream.js?v=3"></script>
  <script src="js/refinery.js?v=3"></script>
  <script src="js/storage.js?v=3"></script>
  <script src="js/logistics.js?v=3"></script>
  <script src="js/distribution.js?v=3"></script>
  <script src="js/spklu.js?v=3"></script>
  <script src="js/ai-analytics.js?v=3"></script>
</body>
</html>
